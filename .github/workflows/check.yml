name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 scripts/check_release.py --git-ref HEAD
      - run: python3 -m unittest discover -s style-library -p 'test_*.py' -q
      - run: for file in style-library/dist/*.js; do node --check "$file"; done
      - run: node --test style-library/test_*.js
      - run: python3 scripts/export_release.py --name ci-source-check
  audits:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: python3 -m pip install pip-audit==2.10.1
      - run: python3 -m pip_audit --no-deps --disable-pip -r requirements.lock.txt
      - run: python3 -m pip_audit --no-deps --disable-pip -r requirements-transcription-macos.lock.txt
  release-gate:
    if: always()
    needs: [core, audits]
    runs-on: ubuntu-latest
    steps:
      - name: Require all test and audit jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          AUDIT_RESULT: ${{ needs.audits.result }}
        run: test "$CORE_RESULT" = success && test "$AUDIT_RESULT" = success
